<app-admin-login *ngIf="!authService.isLoggedIn()" (loggedIn)="onLoggedIn()"></app-admin-login>

<div class="admin-panel" *ngIf="authService.isLoggedIn()">
  <aside class="admin-sidebar">
    <div class="sidebar-header">پنل مدیریت</div>

    <nav class="sidebar-nav">
      <div class="sidebar-group" *ngFor="let group of menuGroups">
        <button class="sidebar-group-header" (click)="toggleGroup(group.key)" [class.open]="isGroupOpen(group.key)">
          <span class="nav-icon">{{ group.icon }}</span>
          <span class="nav-label">{{ group.label }}</span>
          <span class="group-chevron">{{ isGroupOpen(group.key) ? '−' : '+' }}</span>
        </button>

        <div class="sidebar-group-items" *ngIf="isGroupOpen(group.key)">
          <ng-container *ngFor="let tab of group.tabs">
            <button
              class="sidebar-tab"
              [class.active]="activeTab === tab.key && !tab.subItems"
              [class.active-parent]="activeTab === tab.key && tab.subItems"
              (click)="toggleTab(tab)">
              <span class="nav-icon">{{ tab.icon }}</span>
              <span class="nav-label">{{ tab.label }}</span>
              <span class="group-chevron" *ngIf="tab.subItems">{{ isTabOpen(tab.key) ? '−' : '+' }}</span>
            </button>

            <div class="sidebar-sub-items" *ngIf="tab.subItems && isTabOpen(tab.key)">
              <button
                *ngFor="let sub of tab.subItems"
                class="sidebar-sub-tab"
                [class.active]="activeTab === tab.key && activeSubSection === sub.key"
                (click)="setSubSection(tab, sub.key)">
                <span class="nav-icon">{{ sub.icon }}</span>
                <span class="nav-label">{{ sub.label }}</span>
              </button>
            </div>
          </ng-container>
        </div>
      </div>
    </nav>

    <button class="btn-back-to-menu" (click)="logout()">
      <span class="nav-icon">🔒</span>
      <span class="nav-label">خروج</span>
    </button>
    <button class="btn-back-to-menu" (click)="goBack()">
      <span class="nav-icon">🍽️</span>
      <span class="nav-label">بازگشت</span>
    </button>
  </aside>

  <div class="admin-content">
    <app-product-admin *ngIf="activeTab === 'products'"></app-product-admin>
    <app-category-admin *ngIf="activeTab === 'categories'"></app-category-admin>
    <app-order-type-config *ngIf="activeTab === 'order-type'"></app-order-type-config>
    <app-inventory-admin *ngIf="activeTab === 'inventory'"></app-inventory-admin>
    <app-printer-admin *ngIf="activeTab === 'printers'"></app-printer-admin>
    <app-pos-device-admin *ngIf="activeTab === 'pos-devices'"></app-pos-device-admin>
    <app-payment-method-admin *ngIf="activeTab === 'payment-methods'"></app-payment-method-admin>
    <app-style-admin *ngIf="activeTab === 'style'"></app-style-admin>
    <app-reports *ngIf="activeTab === 'reports'"></app-reports>
    <app-user-admin *ngIf="activeTab === 'users'"></app-user-admin>
    <app-purchase-sale-admin *ngIf="activeTab === 'purchase-sale'" [section]="activeSubSection"></app-purchase-sale-admin>
    <app-accounting-admin *ngIf="activeTab === 'accounting'" [section]="activeSubSection"></app-accounting-admin>
  </div>
</div>
