<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">صفحه شروع</title>
  <desc id="desc">تصویر شروع برای کیوسک با پیام لمس برای شروع</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115" />
      <stop offset="1" stop-color="#1f2630" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#d61f2c" stop-opacity="0.7" />
      <stop offset="1" stop-color="#0f1115" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#glow)" />
  <g opacity="0.2">
    <circle cx="200" cy="150" r="140" fill="#ffcc33" />
    <circle cx="1350" cy="120" r="180" fill="#d61f2c" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2">
    <path d="M120 620 C 380 450, 520 750, 820 600 S 1320 520, 1480 700" />
    <path d="M140 720 C 420 560, 600 820, 900 660 S 1360 580, 1520 760" />
  </g>
  <g font-family="'Segoe UI', Tahoma, sans-serif" fill="#ffffff">
    <text x="50%" y="46%" text-anchor="middle" font-size="64" font-weight="700">به کیوسک خوش آمدید</text>
    <text x="50%" y="56%" text-anchor="middle" font-size="32" opacity="0.8">برای شروع لمس کنید</text>
  </g>
</svg>
