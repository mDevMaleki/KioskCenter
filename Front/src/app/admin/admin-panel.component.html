<app-admin-login *ngIf="!authService.isLoggedIn()" (loggedIn)="onLoggedIn()"></app-admin-login>

<div class="admin-panel" *ngIf="authService.isLoggedIn()">
  <aside class="admin-sidebar">
    <div class="sidebar-header">پنل مدیریت</div>

    <nav class="sidebar-nav">
      <button
        *ngFor="let tab of tabs"
        [class.active]="activeTab === tab.key"
        (click)="setTab(tab.key)">
        <span class="nav-icon">{{ tab.icon }}</span>
        <span class="nav-label">{{ tab.label }}</span>
      </button>
    </nav>

    <button class="btn-back-to-menu" (click)="logout()">
      <span class="nav-icon">🔒</span>
      <span class="nav-label">خروج</span>
    </button>
    <button class="btn-back-to-menu" (click)="goBack()">
      <span class="nav-icon">🍽️</span>
      <span class="nav-label">بازگشت</span>
    </button>
  </aside>

  <div class="admin-content">
    <app-product-admin *ngIf="activeTab === 'products'"></app-product-admin>
    <app-category-admin *ngIf="activeTab === 'categories'"></app-category-admin>
    <app-order-type-config *ngIf="activeTab === 'order-type'"></app-order-type-config>
    <app-inventory-admin *ngIf="activeTab === 'inventory'"></app-inventory-admin>
    <app-printer-admin *ngIf="activeTab === 'printers'"></app-printer-admin>
    <app-pos-device-admin *ngIf="activeTab === 'pos-devices'"></app-pos-device-admin>
    <app-payment-method-admin *ngIf="activeTab === 'payment-methods'"></app-payment-method-admin>
    <app-style-admin *ngIf="activeTab === 'style'"></app-style-admin>
    <app-reports *ngIf="activeTab === 'reports'"></app-reports>
    <app-user-admin *ngIf="activeTab === 'users'"></app-user-admin>
    <app-purchase-sale-admin *ngIf="activeTab === 'purchase-sale'"></app-purchase-sale-admin>
    <app-accounting-admin *ngIf="activeTab === 'accounting'"></app-accounting-admin>
  </div>
</div>
