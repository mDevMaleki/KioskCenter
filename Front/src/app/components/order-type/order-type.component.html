<div class="kiosk-container">
  <div class="order-grid">
    <div class="card"
         *ngFor="let type of activeOrderTypes"
         (click)="selectOrderType(type.id)">
      <img *ngIf="type.imageUrl" [src]="getOrderTypeImage(type.imageUrl)" class="card-image" [alt]="type.persianName">
      <div *ngIf="!type.imageUrl" class="card-icon">{{type.icon}}</div>
      <div class="card-title">{{type.persianName}}</div>
    </div>
  </div>
  <button class="btn-back-to-menu" (click)="backToMenu()">
    🍽️ بازگشت
  </button>
  <div class="footer-logo">
    <img [src]="getLogoUrl()" alt="Aghadoon Logo" (click)="goToAdmin()" (error)="onLogoError($event)">
  </div>
</div>
